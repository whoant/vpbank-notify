[package]
name = "fcm-listener"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native Firebase push registration, TLS transport and Web Push decoding"
publish = false
readme = "README.md"
keywords = ["push", "fcm"]

[dependencies]
base64 = "0.22"
bytes = "1.10"
ece = "2.3.1"
prost = "0.14"
rand = "0.9"
reqwest = { version = "0.13", features = ["form", "json"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util", "net"] }
tokio-rustls = { version = "0.26.2", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-stream = { version = "0.1", default-features = false }
webpki-roots = "1"
zeroize = "1"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt"] }

[build-dependencies]
prost-build = "0.14"
